<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaffold Compliance Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#FBCE07;--r:#DD1D21;--ink:#1c1c1c;--g:#6b6b6b;--g2:#9a9a9a;--line:#e3e3e3;--bg:#f6f6f6;--ok:#2e7d32;--warn:#e08a00;}
*{box-sizing:border-box}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{background:#fff;border-bottom:3px solid var(--y);padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
h1{font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--g);font-size:17px;margin:6px 0 0}
.tr{text-align:right;font-size:12px;color:var(--g)}
.ver{display:block;margin-bottom:3px;letter-spacing:.08em}
.lang button{border:1px solid var(--line);background:#fff;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer;color:var(--g)}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.who{margin-top:4px}.who a{color:var(--r);cursor:pointer;margin-left:6px}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:12px 14px;font:inherit;text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--g);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--y);font-weight:500}
main{max-width:980px;margin:0 auto;padding:14px}
h2{font-weight:300;text-transform:uppercase;letter-spacing:.18em;color:var(--g);font-size:14px;margin:18px 0 8px}
.card{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);padding:12px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:28px;font-weight:300}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--g)}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--g);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfcfcf;font:inherit;background:#fff;border-radius:0}
textarea{min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.btn{background:var(--y);border:0;padding:11px 18px;font:inherit;font-weight:500;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;color:var(--ink)}
.btn.sec{background:#fff;border:1px solid var(--ink)}
.btn.red{background:var(--r);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:wait}
.chip{display:inline-block;padding:2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;border:1px solid;white-space:nowrap}
.c-Active,.c-Approved,.c-Pass{color:var(--ok);border-color:var(--ok)}
.c-Pending,.c-NoCert,.c-Incomplete{color:var(--warn);border-color:var(--warn)}
.c-Overdue,.c-DoNotUse,.c-Expired,.c-Fail,.c-Suspended{color:var(--r);border-color:var(--r)}
.c-Dismantled{color:var(--g2);border-color:var(--g2)}
.item{background:#fff;border:1px solid var(--line);padding:11px 12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.item small{color:var(--g);display:block;margin-top:2px}
.id{font-weight:500;letter-spacing:.04em}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar>*{flex:1;min-width:120px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;overflow:auto;padding:14px}
.modal>div{background:#fff;max-width:640px;margin:0 auto;padding:16px;border-top:4px solid var(--y)}
.ck{border-bottom:1px solid var(--line);padding:9px 0}
.ck .opts{display:flex;gap:6px;margin-top:6px}
.ck .opts label{margin:0;flex:1;text-align:center;border:1px solid #cfcfcf;padding:7px 4px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.ck input[type=radio]{display:none}
.ck input[type=radio]:checked+span{font-weight:600}
.ck .opts label.selP{background:#e6f3e7;border-color:var(--ok)}
.ck .opts label.selF{background:#fde8e8;border-color:var(--r)}
.ck .opts label.selN{background:#eee}
.ck .cm{display:none;margin-top:6px}
.gt{font-weight:500;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--g);margin:16px 0 0}
.big{font-size:26px;font-weight:500;letter-spacing:.06em;text-align:center;padding:14px;border:2px dashed var(--ink);margin:12px 0;word-break:break-all}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;z-index:40;max-width:90%}
.toast.err{background:var(--r)}
.muted{color:var(--g)}.pv{max-width:100%;max-height:200px;margin-top:6px;border:1px solid var(--line)}
img.full{width:100%}
.login{max-width:380px;margin:40px auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
label.chk{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:flex-start;margin:12px 0}label.chk input{margin-top:3px}.lockbar{background:#fffbe6;border-left:3px solid var(--y);padding:8px 12px;margin:8px 0;font-size:13px}
</style>
</head>

/* ================= state & helpers ================= */
var S = {crew:[],cf:{q:'',c:''},lang:localStorage.getItem('sc_lang')||'en',tab:'dash',user:null,cfg:null,scf:[],sup:[],users:[],wa:[],fail:{},filter:{q:'',c:'',s:''},insp:null,token:null};
function t(k){return (L[S.lang]&&L[S.lang][k])||L.en[k]||k;}
function ck(k){return (CK[S.lang]&&CK[S.lang][k])||CK.en[k]||k;}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function fd(s){if(!s)return '—';var p=String(s).split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:s;}
function apiUrl(){return API_URL.indexOf('http')===0?API_URL:(localStorage.getItem('sc_api')||'');}
function chip(s){return '<span class="chip c-'+esc(s)+'">'+esc(t(s))+'</span>';}
function toast(m,err){var d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},err?5000:2600);}
function api(action,data){
  var body=Object.assign({action:action,token:S.token},data||{});
  return fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
   .then(function(r){return r.text();})
   .then(function(tx){var j;try{j=JSON.parse(tx);}catch(e){throw new Error('Cannot reach the server. Check the web app URL, and that access is set to Anyone.');}return j;})
   .then(function(j){if(!j.ok){if(j.error==='AUTH'){logout(true);throw new Error('Session expired');}throw new Error(j.error||'Error');}return j;});
}
function compress(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var w=img.width,h=img.height,r=Math.min(1,1400/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
   var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72));};
  img.onerror=function(){rej(new Error('Image error'));};img.src=u;});}
function typeLabel(k){var x=(S.cfg.types||[]).filter(function(y){return y.k===k;})[0];return x?x.label:k;}

  if(apiUrl().indexOf('http')!==0){app.innerHTML='<div class="login card"><h2>'+t('setupApi')+'</h2><input id="apiin" placeholder="https://script.google.com/macros/s/…/exec"><p><button class="btn" id="apisave">'+t('save')+'</button></p></div>';
    $('apisave').onclick=function(){localStorage.setItem('sc_api',$('apiin').value.trim());render();};return;}
  if(!S.token){renderLogin();return;}
  if(!S.user){app.innerHTML='<main><p class="muted">'+t('loading')+'</p></main>';refresh().then(render).catch(function(e){if(!S.token){renderLogin();return;}app.innerHTML='<main><p style="color:var(--r)">'+esc(e.message)+'</p><button class="btn" id="retry">Retry</button></main>';$('retry').onclick=render;});return;}
  var tabs=[['dash','t_dash'],['scaf','t_scaf']];

  tabs.push(['sup','t_sup']);tabs.push(['crew','t_crew']);
  if(can('admin')){tabs.push(['rem','t_rem']);tabs.push(['admin','t_admin']);}
  app.innerHTML='<header><div><h1>'+t('title')+'</h1></div><div class="tr"><span class="ver">'+t('version')+' '+VERSION+'</span><span class="lang">'+['en','id','ms'].map(function(l){return '<button data-lang="'+l+'" class="'+(S.lang===l?'on':'')+'">'+l.toUpperCase()+'</button>';}).join('')+'</span><div class="who"><a href="instructions.html" style="color:var(--g);margin:0 6px 0 0">'+t('instr')+'</a>'+esc(S.user.name)+' · '+esc(S.user.role)+'<a data-act="logout">'+t('logout')+'</a></div></div></header>'+
   '<nav>'+tabs.map(function(x){return '<button data-tab="'+x[0]+'" class="'+(S.tab===x[0]?'on':'')+'">'+t(x[1])+'</button>';}).join('')+'</nav><main id="view"></main>';
  var v={dash:vDash,scaf:vScaf,'new':vNew,insp:vInsp,sup:vSup,crew:vCrew,rem:vRem,admin:vAdmin}[S.tab]||vDash;
  v($('view'));
}

   '<div style="text-align:right;margin-top:6px" class="tr"><span class="ver">'+t('version')+' '+VERSION+'</span><span class="lang">'+['en','id','ms'].map(function(l){return '<button data-lang="'+l+'" class="'+(S.lang===l?'on':'')+'">'+l.toUpperCase()+'</button>';}).join('')+'</span><div><a href="instructions.html" style="color:var(--g);font-size:12px">'+t('instr')+'</a></div></div>'+

  var need=S.scf.filter(function(s){return s.status==='Pending'||s.status==='Overdue'||s.status==='DoNotUse'||(s.status==='Active'&&s.daysToDue!==null&&s.daysToDue<=1);});

  if(pre){S.insp={refId:pre,kind:null,answers:{},comments:{},front:null,back:null};}
  var I=S.insp;
  if(!I||!I.refId){
    el.innerHTML='<div class="card"><label>'+t('pick')+'</label><input id="pq" list="pl" placeholder="'+t('pickPh')+'" autocomplete="off"><datalist id="pl">'+eligibleInsp().map(function(s){return '<option value="'+esc(s.refId)+'">'+esc(s.locationFull||s.location)+' · '+t(s.status)+'</option>';}).join('')+'</datalist></div><div id="pickres"></div>';

    return;
  }
  var s=S.scf.filter(function(x){return x.refId===I.refId;})[0];if(!s){S.insp=null;return vInsp(el);}
  var kinds=!s.handoverDone?(role()==='supervisor'?[]:['Handover']):(role()==='supervisor'?['Weekly']:['Weekly','Special']);
  if(!kinds.length){el.innerHTML='<div class="card"><div class="item" style="cursor:default"><div><span class="id">'+esc(s.refId)+'</span><small>'+esc(s.locationFull||s.location)+'</small></div>'+chip(s.status)+'</div><p>'+t('waitInspector')+'</p><p><button class="btn sec" id="cx">'+t('cancel')+'</button></p></div>';$('cx').onclick=function(){S.insp=null;vInsp(el);};return;}

    return {name:p[0],contractor:p[1],phone:p[2],email:p[3],certType:p[4],certNo:p[5],issueDate:normDate(p[6]),expiryDate:normDate(p[7])};});

   askConfirm(function(){api('importSupervisors',{rows:rows,verified:true,confirmed:true}).then(function(j){m.querySelector('#out').innerHTML='<p>'+t('imported')+': '+j.added+'</p>'+j.errors.map(function(e){return '<p style="color:var(--r)">'+esc(e)+'</p>';}).join('');return refresh();}).then(function(){render();}).catch(function(x){toast(x.message,1);});});};
}

function vRem(el){
  el.innerHTML='<div class="bar"><button class="btn" id="run">'+t('runNow')+'</button></div><h2>'+t('waQueue')+'</h2><p class="muted">'+t('waHelp')+'</p>'+
   (S.wa.length?S.wa.map(function(w){return '<div class="card"><b>'+esc(w.toName)+'</b> <span class="muted">'+fd(w.date)+'</span><p style="font-size:13px">'+esc(w.message)+'</p><a class="btn sm" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+esc(w.link)+'">'+t('sendWa')+'</a> <button class="btn sec sm" data-wasent="'+esc(w.id)+'">'+t('markSent')+'</button></div>';}).join(''):'<p class="muted">'+t('none')+'</p>');
  $('run').onclick=function(){var b=this;b.disabled=true;api('runNow').then(function(j){toast(t('ranNow')+': WA '+j.result.wa+', mail '+j.result.mails);return refresh();}).then(function(){render();}).catch(function(x){toast(x.message,1);b.disabled=false;});};
}
function vAdmin(el){
  var types=S.cfg.types.map(function(x){return x.k+':'+x.label;}).join('|');
  el.innerHTML='<h2>'+t('settings')+'</h2><div class="card"><form id="cf"><label>'+t('interval')+'</label><input name="intervalDays" type="number" min="1" max="31" value="'+S.cfg.intervalDays+'"><label>'+t('contractors')+'</label><input name="contractors" value="'+esc(S.cfg.contractors.join(','))+'"><label>'+t('types')+'</label><input name="types" value="'+esc(types)+'"><label>'+t('locList')+'</label><textarea name="mainLocations" id="ml" rows="8">'+esc(S.cfg.mainLocations.join('\n'))+'</textarea><p><button class="btn sec" type="button" id="msync">'+t('syncUauc')+'</button> <span class="muted" id="msst"></span></p><p><button class="btn" type="submit">'+t('save')+'</button></p></form></div>'+
   '<h2>'+t('users')+'</h2>'+S.users.map(function(u){return '<div class="item" data-user="'+esc(u.email)+'"><div><span class="id">'+esc(u.name)+'</span><small>'+esc(u.email)+' · '+esc(u.role)+(u.contractor?' · '+esc(u.contractor):'')+'</small></div>'+(u.active==='FALSE'?'<span class="chip c-Dismantled">off</span>':'')+'</div>';}).join('')+
   '<p><button class="btn" id="au">'+t('addUser')+'</button></p>';
  $('cf').onsubmit=function(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v;});api('saveConfig',d).then(function(){return refresh();}).then(function(){toast(t('save'));render();}).catch(function(x){toast(x.message,1);});};
  $('au').onclick=function(){userForm(null);};
  $('msync').onclick=function(){$('msst').textContent='…';fetchUauc().then(function(l){$('ml').value=l.join('\n');$('msst').textContent=l.length+' '+t('locFound');}).catch(function(){$('msst').textContent=t('syncFail');});};
}
var UAUC_URL='https://iggifernandes.github.io/EcoOils-Project-UAUC-Report/';
function fetchUauc(){return fetch(UAUC_URL+'?_='+Date.now()).then(function(r){if(!r.ok)throw new Error('http');return r.text();}).then(function(h){
  var m=/var LOCATIONS=\[([^\]]*)\]/.exec(h);if(!m)throw new Error('nolist');
  var out=[],re=/'([^']+)'/g,x;while((x=re.exec(m[1])))out.push(x[1].trim());
  if(out.length<5)throw new Error('short');return out;});}
function userForm(email){
  var u=email?S.users.filter(function(x){return x.email===email;})[0]:{role:'inspector',active:'TRUE'};
  var m=modal('<form id="uf"><h2>'+t('addUser')+'</h2><label>'+t('email')+'</label><input name="email" type="email" value="'+esc(u.email||'')+'" '+(email?'readonly':'')+' required><label>'+t('name')+'</label><input name="name" value="'+esc(u.name||'')+'">'+
   '<div class="row2"><div><label>'+t('role')+'</label><select name="role">'+['admin','inspector','supervisor','viewer'].map(function(r){return '<option '+(u.role===r?'selected':'')+'>'+r+'</option>';}).join('')+'</select></div><div><label>'+t('contractor')+'</label><select name="contractor"><option value="">—</option>'+S.cfg.contractors.map(function(c){return '<option '+(u.contractor===c?'selected':'')+'>'+c+'</option>';}).join('')+'</select></div></div>'+
   '<label>'+t('active')+'</label><select name="active"><option value="TRUE" '+(u.active!=='FALSE'?'selected':'')+'>On</option><option value="FALSE" '+(u.active==='FALSE'?'selected':'')+'>Off</option></select><p><button class="btn" type="submit">'+t('save')+'</button> <button type="button" class="btn sec" id="x">'+t('cancel')+'</button></p></form>');
  m.querySelector('#x').onclick=function(){m.remove();};
  m.querySelector('#uf').onsubmit=function(e){e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){d[k]=v;});api('saveUser',d).then(function(){return refresh();}).then(function(){m.remove();render();}).catch(function(x){toast(x.message,1);});};
}

function showPhoto(id){var m=modal('<p class="muted">'+t('loading')+'</p><p><button class="btn sec" id="x">'+t('close')+'</button></p>');m.querySelector('#x').onclick=function(){m.remove();};
  api('getPhoto',{id:id}).then(function(j){m.firstChild.innerHTML='<img class="full" src="'+j.dataUrl+'"><p><button class="btn sec" id="x2">'+t('close')+'</button></p>';m.querySelector('#x2').onclick=function(){m.remove();};}).catch(function(e){toast(e.message,1);m.remove();});}

function scafDetail(refId){
  var s=S.scf.filter(function(x){return x.refId===refId;})[0];if(!s)return;
  var m=modal('<h2 style="margin-top:0">'+esc(s.refId)+' '+chip(s.status)+'</h2><table>'+
   [['contractor',s.contractor],['type',s.type+' · '+typeLabel(s.type)],['mainLoc',s.location],['subLoc',s.subLocation||'—'],['requestedBy',s.requestedBy],['builtBy',s.builtByName],['erected',fd(s.erectedDate)],['loadClass',s.loadClass+(s.loadKg?' ('+s.loadKg+' kg/m²)':'')],['lastInsp',fd(s.lastInspectionDate)],['nextDue',fd(s.nextDueDate)],['inspector',s.inspector||'—']].map(function(r){return '<tr><td class="muted">'+t(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+'</table>'+
   '<p>'+(s.tagFrontId?'<button class="btn sec sm" data-photo="'+esc(s.tagFrontId)+'">'+t('front')+'</button> ':'')+(s.tagBackId?'<button class="btn sec sm" data-photo="'+esc(s.tagBackId)+'">'+t('back')+'</button> ':'')+'</p>'+
   '<p>'+((s.rawStatus!=='Dismantled'&&can('inspect'))?'<button class="btn" id="di">'+t('inspectNow')+'</button> ':'')+((s.rawStatus!=='Dismantled'&&role()!=='viewer')?'<button class="btn red sm" id="dd">'+t('dismantle')+'</button> ':'')+'<button class="btn sec sm" id="dx">'+t('close')+'</button></p>'+
   '<h2>'+t('history')+'</h2><div id="hs"><p class="muted">'+t('loading')+'</p></div>');
  m.querySelector('#dx').onclick=function(){m.remove();};
  var di=m.querySelector('#di');if(di)di.onclick=function(){m.remove();S.tab='insp';S.insp={refId:s.refId,kind:null,answers:{},comments:{},front:null,back:null};render();};
  var dd=m.querySelector('#dd');if(dd)dd.onclick=function(){if(!confirm(t('confirmDis')))return;api('dismantle',{refId:s.refId}).then(function(){return refresh();}).then(function(){m.remove();render();}).catch(function(x){toast(x.message,1);});};
  m.addEventListener('click',function(e){var p=e.target.getAttribute&&e.target.getAttribute('data-photo');if(p)showPhoto(p);});
  api('history',{refId:s.refId}).then(function(j){m.querySelector('#hs').innerHTML=j.history.length?j.history.map(function(h){
    return '<div class="card" style="padding:10px"><b>'+fd(h.date)+' '+esc(h.time)+'</b> · '+t(h.kind)+' · '+esc(h.inspector)+' '+chip(h.result)+
     (h.failed.length?'<ul style="margin:6px 0;padding-left:18px;font-size:13px">'+h.failed.map(function(f){return '<li>'+esc(ck(f.id))+(f.c?' — <i>'+esc(f.c)+'</i>':'')+'</li>';}).join('')+'</ul>':'')+
     (h.comments?'<div class="muted" style="font-size:13px">'+esc(h.comments)+'</div>':'')+
     '<div style="margin-top:6px">'+(h.photoFrontId?'<button class="btn sec sm" data-photo="'+esc(h.photoFrontId)+'">'+t('front')+'</button> ':'')+(h.photoBackId?'<button class="btn sec sm" data-photo="'+esc(h.photoBackId)+'">'+t('back')+'</button>':'')+'</div></div>';}).join(''):'<p class="muted">'+t('none')+'</p>';}).catch(function(e){m.querySelector('#hs').textContent=e.message;});
}

/* ================= events ================= */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-lang],[data-tab],[data-act],[data-scaf],[data-sup],[data-crew],[data-go],[data-inspect],[data-wasent],[data-user],[data-photo]');if(!el)return;
  if(el.hasAttribute('data-photo')&&el.closest('.modal')&&!el.closest('#sf,#crf')){return;}
  if(el.hasAttribute('data-photo')){showPhoto(el.getAttribute('data-photo'));return;}
  if(el.hasAttribute('data-lang')){S.lang=el.getAttribute('data-lang');localStorage.setItem('sc_lang',S.lang);document.documentElement.lang=S.lang;render();return;}
  if(el.hasAttribute('data-tab')){S.tab=el.getAttribute('data-tab');if(S.tab!=='insp')S.insp=null;render();return;}
  if(el.getAttribute('data-act')==='logout'){logout();return;}
  if(el.hasAttribute('data-scaf')){scafDetail(el.getAttribute('data-scaf'));return;}
  if(el.hasAttribute('data-sup')){var sid=el.getAttribute('data-sup'),sr=S.sup.filter(function(x){return x.id===sid;})[0];if(can('admin')&&sr&&sr.locked==='1')supView(sid);else if(can('admin'))supForm(sid);else S.tab='sup',render();return;}
  if(el.hasAttribute('data-crew')){var cid=el.getAttribute('data-crew'),cr=S.crew.filter(function(x){return x.id===cid;})[0];if(can('admin')&&cr&&cr.locked!=='1')crewForm(cid);else crewView(cid);return;}
  if(el.hasAttribute('data-go')){S.filter={q:'',c:'',s:el.getAttribute('data-go')};S.tab='scaf';render();return;}
  if(el.hasAttribute('data-inspect')){S.tab='insp';vInsp($('view'),el.getAttribute('data-inspect'));return;}
  if(el.hasAttribute('data-wasent')){api('waMark',{id:el.getAttribute('data-wasent')}).then(function(){return refresh();}).then(render).catch(function(x){toast(x.message,1);});return;}
  if(el.hasAttribute('data-user')){userForm(el.getAttribute('data-user'));return;}
});
loadSession();render();
</script>

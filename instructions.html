<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scaffold Compliance Hub – Instructions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#FBCE07;--r:#DD1D21;--ink:#1c1c1c;--g:#6b6b6b;--line:#e3e3e3;--bg:#f6f6f6;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font-family:'Jost',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
h1{font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--g);font-size:17px;margin:6px 0 0}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-weight:300;text-transform:uppercase;letter-spacing:.18em;color:var(--g);font-size:14px;margin:26px 0 8px}
.card{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:500}
.tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border:1px solid var(--line);color:var(--g);margin-left:6px}
.tag.live{color:var(--ok);border-color:var(--ok)}.tag.plan{color:#a67c00;border-color:var(--y)}
ol,ul{margin:6px 0 0;padding-left:20px}li{margin:3px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:center;font-size:13px}
th{font-weight:500;background:#fafafa;font-size:12px}td:first-child,th:first-child{text-align:left}
.Y{color:var(--ok);font-weight:600}.O{color:#a67c00;font-weight:600}.V{color:var(--g)}.N{color:#bbb}
.note{border-left:3px solid var(--y);background:#fffbe6;padding:8px 12px;margin:10px 0;font-size:14px}
.legend{font-size:12px;color:var(--g);margin-top:6px}
a.btn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;padding:9px 16px;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
/* eco-std-header */
header.eh{background:#fff;color:#231f20;padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid #dcdcdc;position:relative;z-index:5;margin:0;width:auto;max-width:none;height:auto;min-height:0;box-shadow:none;font-family:Jost,system-ui,Arial,sans-serif;font-size:16px;line-height:1.45}
header.eh .eh-logo{height:44px;width:auto;max-width:58%;object-fit:contain;display:block;margin:0}
header.eh .eh-r{display:flex;flex-direction:column;align-items:flex-end;gap:0;margin-left:auto}
header.eh .eh-v{font-size:12px;letter-spacing:.08em;color:#6e6b6c;line-height:1.2;padding:2px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:400;background:none;border:0}
header.eh .eh-d{font-size:11px;letter-spacing:.06em;color:#aaaaaa;line-height:1.2;padding:2px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums}
header.eh .eh-l{display:flex;gap:0;margin:0;padding:0;background:none;border:0}
header.eh .eh-l button{background:none;color:#6e6b6c;border:0;border-bottom:3px solid transparent;border-radius:0;min-width:44px;min-height:44px;padding:0 8px;margin:0;font:400 15px/1 Jost,system-ui,Arial,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:none;opacity:1;text-transform:none}
header.eh .eh-l button.on,header.eh .eh-l button.active,header.eh .eh-l button[aria-pressed="true"]{color:#231f20;font-weight:600;border-bottom-color:#44a276;background:none}
@media(max-width:420px){header.eh .eh-l button{min-width:40px}}
.hubtitle{padding:4px 16px 0}.hubtitle h1{margin:10px 0 0}

en:{ver:'Version',title:'Scaffold Compliance Hub',sub:'Instructions',
intro:'This database keeps everything about working at height on the Mentari Project in one place: scaffolds, the people who build them, their training, and the harnesses they wear. Data is owned and kept up to date by the contractors (IC) HSSE and the scaffold inspector, not by one central person.',
modH:'The four parts',live:'Live',plan:'Planned',
mods:[['1. Scaffold inventory and inspection','Every scaffold gets a unique ID, a main location and a sub location, a signed tag photo, and weekly inspections with reminders.','live'],
['2. Scaffolders and certificates (external)','Names, role, external certificate (type, number, issue, expiry), photo of the person and of the certificate. Expiry reminders at 30/14/7/1/0 days.','live'],
['3. Internal Working at Height training (scaffolders only)','Record of the internal Working at Height training of scaffolders and scaffolding supervisors: date, trainer, validity and refresher due date. Training of other crew is not kept here.','plan'],
['4. Full body harness registry and inspection','Each harness has a serial number, owner contractor and user, and a record of every inspection by HSSE and the scaffolding supervisor. Defective harness is tagged Do not use.','plan']],
whoH:'Who does what',
roles:[['IC HSSE Manager / Admin (ic_admin)','One login per contractor. Can ADD scaffolders, scaffold supervisors and inspectors for their own contractor only, and mark any person On leave, Resigned, Demobilised, Left site or Deleted (with date and reason). Cannot edit, renew, unlock, approve or change settings. Supervisors and inspectors they add wait for the HSSE Manager to approve. Nothing is erased: all status changes appear under People movements on the dashboard.'],['Mentari HSSE (admin)','Oversight only: settings, user list, location list, all contractors. Does not enter contractor data day to day.'],
['IC HSSE (GSB, WEN, KKS, PBS)','Owner of the data for their own contractor: uploads supervisors, scaffolders, certificates, photos, training and harness records. Can register scaffolds and keep the register clean.'],
['Scaffold inspector','Final authority. Registered under Inspectors with a certificate that the admin approves. Fills the tag-style form for the scaffold the foreman built, does the Handover inspection (and enters the sub location), Special inspections, re-inspection after a fail and red tag removal. Sees all contractors.'],
['Scaffolding supervisor','The foreman. Builds the scaffold with the team and waits for the inspector to inspect and tag it. Can register scaffolds, does the weekly inspection and the harness inspections of the crew. Sees own contractor only. Cannot edit certificates or registers.'],
['Viewer','Read only.']],
accH:'Access (proposed)',accNote:'This table is the proposal. The "IC HSSE" role is new and still has to be added to the app: today the app only has admin, inspector, supervisor and viewer. Modules 3 and 4 are not built yet.',

procH:'How the process works',
procs:[['Scaffold (live)',['The foreman and team build the scaffold and wait for the inspector. The inspector fills in a form laid out like the physical tag: location, requested by, built by (several foremen allowed; the inspector too in a small team), date and structure to be used for. A live tag preview fills in as he types. No ID is generated yet.','Next page: the Handover inspection checklist. The inspector completes every item, writes the overall comments and the sub location, ticks the inspector declaration ("I have inspected this scaffold and I confirm it is fit to use"; if any item failed the declaration says it is NOT fit and the scaffold is red-tagged) and confirms in a pop-up by entering his own personal PIN (set once with a code emailed to him; nobody else can inspect on his behalf).','Only now is the ID generated, for example PBS-T-2610-001. A failed inspection also gets an ID.','Tag photo (locked): a pop-up shows the finished tag with the ID. The inspector writes the ID on the tag, signs it and uploads a photo of the signed tag. Until the photo is uploaded nothing else is possible for that inspector, and the pop-up returns every time the app is opened. The scaffold becomes Active only after the photo. If a phone is lost or broken, the admin can release the lock with a written reason (logged). A missing photo after 24 hours appears in the admin daily digest.','A foreman can send a scaffold request from the same tag form. It has no ID. The inspector opens it under New scaffold > Foreman requests and does the steps above.','The app gives the unique ID, for example PBS-T-2610-001 (contractor, type, year and month, running number). Status is Pending: do not use.','The scaffold inspector is notified, goes to site, enters the sub location, completes the full Handover checklist and uploads the photo of the signed tag (front).','If everything passes the scaffold becomes Active and the next inspection date is set. Any failed item makes it Do not use, and the supervisor is told.','Every week the supervisor or inspector does the weekly inspection and uploads the tag back (inspection grid) photo. The app reminds one day before and on the due day. Missed date = Overdue.','Anyone responsible (admin, inspector, or the supervisor for their own contractor) can press the Red tag button at any time if a scaffold is unsafe. The date and time, who and why are recorded, the scaffold shows RED TAG · Do not use, and the supervisor and inspectors are emailed. A failed inspection also red-tags automatically. Reminders continue daily until it is cleared.','Only an inspector can clear a red tag: pass a re-inspection (the tag is removed automatically and logged) or use Remove red tag with a written reason. Every red tag and removal stays in the red tag log with its time.','When the scaffold is taken down it is marked Dismantled and the record stays as history.']],
['Scaffolders and certificates (live)',['IC HSSE adds each scaffolder: name, role, phone, photo of the person.','Add the external certificate: type, number, issue and expiry dates, and a photo of the certificate. Without a certificate the person shows as No certificate and is not counted as certified.','Scaffolder Helpers do not need an external certificate, but they must have Scaffolding Basic Awareness and Working at Height training (internal or external at least), with dates and expiry. Without both the helper shows as Training incomplete.','Before saving, tick: I have verified the certificate and all data is true and checked. A pop-up then asks you to confirm. If you are not sure, do not submit.','Once submitted, the record is locked and cannot be changed. When a certificate or training is renewed, use Renew and submit the new certificate with a new photo. Every submission is kept. If a mistake was submitted, the admin can unlock the record with a reason, and it must be verified and confirmed again.','The app sends reminders before expiry. Renew the certificate and update the record and photo before the date.']],
['Working at Height training (planned)',['IC HSSE records each internal training: person, date, trainer, validity.','The refresher due date drives the same reminders.']],
['Harness (planned)',['IC HSSE registers each harness: serial number, manufacturer, date of manufacture, issue date, contractor, user.','The scaffolding supervisor inspects before use and records it. HSSE does the periodic inspection and records it. Inspection frequency and the checklist must be confirmed against the Shell / Mentari standard before go-live.','A harness that fails, or is past its life, is tagged Do not use and removed from service.']]],
ruleH:'Rules to remember',
rules:['Only an admin can delete a scaffolder or supervisor, after a confirm pop-up. Deleted records are hidden, not erased, and are logged.','A red-tagged scaffold is never used until an inspector clears the tag.','Certificates and training are verified before submission. A submitted record cannot be changed.','Nobody uses a scaffold until the Handover inspection is passed and the signed tag photo is uploaded.','Only an approved supervisor with a valid certificate, from the same contractor, can be named as the one who checked and approved the scaffold.','Every failed item needs a comment. Overall comments are required on every inspection (write None if nothing to add).','Sign in with your own email and the 6-digit code. Do not share codes.','If a person leaves or a certificate lapses, IC HSSE updates the record the same day.'],
decH:'Decisions needed from Iggy',
decs:['Name confirmed: Scaffold Compliance Hub.','Confirm the access table above, in particular what IC HSSE may do and what the scaffolding supervisor may not.','Confirm harness inspection frequency and checklist (Shell / Mentari standard).','Confirm Working at Height training fields: provider, validity period, refresher interval.'],

id:{ver:'Versi',title:'Hub Kepatuhan Perancah',sub:'Petunjuk',
intro:'Database ini menyimpan semua hal tentang bekerja di ketinggian di Proyek Mentari di satu tempat: perancah, orang yang membangunnya, pelatihan mereka, dan full body harness yang dipakai. Data dimiliki dan diperbarui oleh HSSE kontraktor (IC) dan inspektur perancah, bukan oleh satu orang pusat.',
modH:'Empat bagian',live:'Aktif',plan:'Direncanakan',
mods:[['1. Inventaris dan inspeksi perancah','Setiap perancah mendapat ID unik, lokasi utama dan sub lokasi, foto tag bertanda tangan, dan inspeksi mingguan dengan pengingat.','live'],
['2. Scaffolder dan sertifikat (eksternal)','Nama, jabatan, sertifikat eksternal (jenis, nomor, tanggal terbit, kedaluwarsa), foto orang dan foto sertifikat. Pengingat kedaluwarsa pada 30/14/7/1/0 hari.','live'],
['3. Pelatihan Bekerja di Ketinggian (internal)','Catatan siapa yang sudah menyelesaikan pelatihan internal Bekerja di Ketinggian: tanggal, pelatih, masa berlaku dan tanggal penyegaran.','plan'],
['4. Registri dan inspeksi full body harness','Setiap harness punya nomor seri, kontraktor pemilik dan pemakai, serta catatan setiap inspeksi oleh HSSE dan supervisor perancah. Harness rusak diberi tag Jangan dipakai.','plan']],
whoH:'Siapa melakukan apa',
roles:[['HSSE IC Manager / Admin (ic_admin)','Satu login per kontraktor. Bisa MENAMBAH scaffolder, supervisor scaffold dan inspektur untuk kontraktornya sendiri, serta menandai orang sebagai Cuti, Mengundurkan diri, Demobilisasi, Keluar site atau Dihapus (dengan tanggal dan alasan). Tidak bisa mengubah, memperpanjang, membuka kunci, menyetujui atau mengubah pengaturan. Supervisor dan inspektur yang ditambahkan menunggu persetujuan HSSE Manager. Tidak ada yang dihapus: semua perubahan tampil di Pergerakan personel pada dasbor.'],['HSSE Mentari (admin)','Hanya pengawasan: pengaturan, daftar pengguna, daftar lokasi, semua kontraktor. Tidak mengisi data kontraktor sehari-hari.'],
['HSSE IC (GSB, WEN, KKS, PBS)','Pemilik data kontraktornya sendiri: mengunggah supervisor, scaffolder, sertifikat, foto, pelatihan dan data harness. Bisa mendaftarkan perancah dan menjaga register tetap bersih.'],
['Inspektur perancah','Otoritas akhir. Terdaftar di Inspektur dengan sertifikat yang disetujui admin. Mengisi formulir seperti tag untuk perancah yang dibangun mandor, melakukan inspeksi serah terima (dan mengisi sub lokasi), inspeksi khusus, inspeksi ulang setelah gagal dan melepas red tag. Melihat semua kontraktor.'],
['Supervisor perancah','Mandor. Membangun perancah bersama timnya dan menunggu inspektur memeriksa dan memberi tag. Dapat mendaftarkan perancah, melakukan inspeksi mingguan dan inspeksi harness krunya. Hanya melihat kontraktor sendiri. Tidak bisa mengubah sertifikat atau register.'],
['Pemantau (viewer)','Hanya baca.']],

procH:'Cara kerja prosesnya',
procs:[['Perancah (aktif)',['Mandor dan timnya membangun scaffold lalu menunggu inspektur. Inspektur mengisi formulir yang tata letaknya seperti tag fisik: lokasi, diminta oleh, dibangun oleh (boleh beberapa mandor; inspektur juga pada tim kecil), tanggal dan struktur yang digunakan untuk. Pratinjau tag terisi saat mengetik. ID belum dibuat.','Halaman berikutnya: daftar periksa inspeksi serah terima. Inspektur mengisi semua butir, komentar umum dan sub lokasi, mencentang pernyataan inspektur ("Saya telah memeriksa scaffold ini dan saya menyatakan scaffold ini layak digunakan"; jika ada butir gagal, pernyataan berubah menjadi TIDAK layak dan scaffold diberi red tag) dan mengonfirmasi di pop-up dengan memasukkan PIN pribadinya (dibuat sekali lewat kode yang dikirim ke emailnya; tidak ada orang lain yang bisa memeriksa atas namanya).','Baru sekarang ID dibuat, misalnya PBS-T-2610-001. Inspeksi yang gagal juga mendapat ID.','Foto tag (terkunci): pop-up menampilkan tag jadi dengan ID. Inspektur menulis ID di tag, menandatanganinya dan mengunggah foto tag yang sudah ditandatangani. Sebelum foto diunggah tidak ada tindakan lain untuk inspektur itu, dan pop-up muncul lagi setiap aplikasi dibuka. Scaffold menjadi Aktif hanya setelah ada foto. Jika HP hilang atau rusak, admin dapat melepas kunci dengan alasan tertulis (dicatat). Foto yang belum ada setelah 24 jam muncul di ringkasan harian admin.','Mandor dapat mengirim permintaan scaffold dari formulir tag yang sama. Permintaan tidak punya ID. Inspektur membukanya di Scaffold baru > Permintaan mandor dan melakukan langkah di atas.','Aplikasi memberi ID unik, misalnya PBS-T-2610-001 (kontraktor, jenis, tahun dan bulan, nomor urut). Status Pending: jangan dipakai.','Inspektur perancah diberi tahu, datang ke lokasi, mengisi sub lokasi, mengisi daftar periksa serah terima lengkap dan mengunggah foto tag bertanda tangan (depan).','Jika semua lulus, perancah menjadi Aktif dan tanggal inspeksi berikutnya ditetapkan. Satu butir gagal membuatnya Jangan dipakai, dan supervisor diberi tahu.','Setiap minggu supervisor atau inspektur melakukan inspeksi mingguan dan mengunggah foto tag belakang (kisi inspeksi). Aplikasi mengingatkan sehari sebelumnya dan pada hari jatuh tempo. Terlewat = Terlambat.','Siapa pun yang bertanggung jawab (admin, inspektur, atau supervisor untuk kontraktornya) dapat menekan tombol Red tag kapan saja jika perancah tidak aman. Tanggal dan jam, siapa dan alasannya dicatat, perancah tampil RED TAG · Dilarang dipakai, dan supervisor serta inspektur diberi email. Inspeksi yang gagal juga otomatis memberi red tag. Pengingat berlanjut setiap hari sampai dilepas.','Hanya inspektur yang dapat melepas red tag: lulus inspeksi ulang (tag dilepas otomatis dan dicatat) atau gunakan Lepas red tag dengan alasan tertulis. Setiap pemasangan dan pelepasan tetap ada di log red tag beserta jamnya.','Saat perancah dibongkar, tandai Dibongkar; catatan tetap tersimpan sebagai riwayat.']],
['Scaffolder dan sertifikat (aktif)',['HSSE IC menambahkan setiap scaffolder: nama, jabatan, telepon, foto orang.','Tambahkan sertifikat eksternal: jenis, nomor, tanggal terbit dan kedaluwarsa, serta foto sertifikat. Tanpa sertifikat orang tampil sebagai Tanpa sertifikat dan tidak dihitung bersertifikat.','Helper Scaffolder tidak perlu sertifikat eksternal, tetapi wajib punya Scaffolding Basic Awareness dan pelatihan Working at Height (minimal internal), lengkap dengan tanggal dan masa berlaku. Tanpa keduanya helper tampil sebagai Pelatihan belum lengkap.','Sebelum menyimpan, centang: Saya telah memverifikasi sertifikat dan semua data adalah benar dan sudah diperiksa. Lalu muncul pop-up untuk konfirmasi. Jika ragu, jangan kirim.','Setelah dikirim, data terkunci dan tidak dapat diubah. Saat sertifikat atau pelatihan diperbarui, gunakan Perbarui dan kirim sertifikat baru dengan foto baru. Setiap pengiriman disimpan. Jika ada kesalahan terkirim, admin dapat membuka kunci dengan alasan, dan data harus diverifikasi dan dikonfirmasi lagi.','Aplikasi mengirim pengingat sebelum kedaluwarsa. Perbarui sertifikat, data dan foto sebelum tanggalnya.']],
['Pelatihan Bekerja di Ketinggian (direncanakan)',['HSSE IC mencatat setiap pelatihan internal: orang, tanggal, pelatih, masa berlaku.','Tanggal penyegaran memicu pengingat yang sama.']],
['Harness (direncanakan)',['HSSE IC mendaftarkan setiap harness: nomor seri, pabrikan, tanggal produksi, tanggal diterbitkan, kontraktor, pemakai.','Supervisor perancah memeriksa sebelum dipakai dan mencatatnya. HSSE melakukan inspeksi berkala dan mencatatnya. Frekuensi inspeksi dan daftar periksa harus dikonfirmasi dengan standar Shell / Mentari sebelum go-live.','Harness yang gagal, atau melewati umur pakainya, diberi tag Jangan dipakai dan ditarik dari penggunaan.']]],
ruleH:'Aturan yang harus diingat',
rules:['Hanya admin yang dapat menghapus scaffolder atau supervisor, setelah pop-up konfirmasi. Data terhapus disembunyikan, tidak dihapus permanen, dan tercatat.','Perancah ber-red tag tidak dipakai sampai inspektur melepas tag.','Sertifikat dan pelatihan diverifikasi sebelum dikirim. Data yang sudah dikirim tidak dapat diubah.','Tidak ada yang memakai perancah sebelum inspeksi serah terima lulus dan foto tag bertanda tangan diunggah.','Hanya supervisor disetujui dengan sertifikat berlaku, dari kontraktor yang sama, yang boleh disebut sebagai pemeriksa dan penyetuju.','Setiap butir gagal perlu komentar. Komentar umum wajib di setiap inspeksi (tulis Tidak ada jika tidak ada tambahan).','Masuk dengan email Anda sendiri dan kode 6 digit. Jangan bagikan kode.','Jika seseorang pergi atau sertifikat habis, HSSE IC memperbarui data di hari yang sama.'],
decH:'Keputusan yang dibutuhkan dari Iggy',
decs:['Nama sudah dikonfirmasi: Hub Kepatuhan Perancah.','Konfirmasi tabel akses di atas, terutama apa yang boleh dilakukan HSSE IC dan yang tidak boleh dilakukan supervisor perancah.','Konfirmasi frekuensi dan daftar periksa inspeksi harness (standar Shell / Mentari).','Konfirmasi kolom pelatihan Bekerja di Ketinggian: penyelenggara, masa berlaku, interval penyegaran.'],

whoH:'Siapa buat apa',
roles:[['HSSE IC Manager / Admin (ic_admin)','Satu log masuk setiap kontraktor. Boleh MENAMBAH pembina perancah, penyelia perancah dan pemeriksa untuk kontraktornya sendiri sahaja, dan menanda sesiapa sebagai Bercuti, Berhenti kerja, Demobilisasi, Tinggalkan tapak atau Dipadam (dengan tarikh dan sebab). Tidak boleh mengubah, memperbaharui, membuka kunci, meluluskan atau menukar tetapan. Penyelia dan pemeriksa yang ditambah menunggu kelulusan HSSE Manager. Tiada apa dipadam: semua perubahan dipaparkan di Pergerakan kakitangan pada papan pemuka.'],['HSSE Mentari (admin)','Penyeliaan sahaja: tetapan, senarai pengguna, senarai lokasi, semua kontraktor. Tidak memasukkan data kontraktor setiap hari.'],
['HSSE IC (GSB, WEN, KKS, PBS)','Pemilik data kontraktor sendiri: memuat naik penyelia, scaffolder, sijil, foto, latihan dan rekod harness. Boleh mendaftar perancah dan memastikan daftar kemas.'],
['Pemeriksa perancah','Pihak berkuasa akhir. Didaftarkan di Pemeriksa dengan sijil yang diluluskan admin. Mengisi borang seperti tag untuk perancah yang dibina mandur, membuat pemeriksaan serah terima (dan mengisi sub lokasi), pemeriksaan khas, pemeriksaan semula selepas gagal dan membuang tag merah. Melihat semua kontraktor.'],
['Penyelia perancah','Mandur. Membina perancah bersama pasukannya dan menunggu pemeriksa memeriksa dan menanda. Boleh mendaftar perancah, membuat pemeriksaan mingguan dan pemeriksaan harness krewnya. Hanya melihat kontraktor sendiri. Tidak boleh mengubah sijil atau daftar.'],
['Penonton (viewer)','Baca sahaja.']],

procH:'Cara proses berfungsi',
procs:[['Perancah (aktif)',['Mandur dan pasukannya membina perancah dan menunggu pemeriksa. Pemeriksa mengisi borang yang susunannya seperti tag fizikal: lokasi, dimohon oleh, dibina oleh (beberapa mandur dibenarkan; pemeriksa juga dalam pasukan kecil), tarikh dan struktur untuk digunakan. Pratonton tag terisi semasa menaip. ID belum dijana.','Halaman seterusnya: senarai semak pemeriksaan serah terima. Pemeriksa melengkapkan setiap item, komen keseluruhan dan sub lokasi, menandakan pengesahan pemeriksa ("Saya telah memeriksa perancah ini dan saya mengesahkan ia sesuai digunakan"; jika ada item gagal, pengesahan menjadi TIDAK sesuai dan perancah ditanda merah) dan mengesahkan dalam pop-up dengan memasukkan PIN peribadinya (ditetapkan sekali melalui kod yang dihantar ke e-melnya; tiada orang lain boleh memeriksa bagi pihaknya).','Hanya sekarang ID dijana, contohnya PBS-T-2610-001. Pemeriksaan yang gagal juga mendapat ID.','Foto tag (dikunci): pop-up memaparkan tag siap dengan ID. Pemeriksa menulis ID pada tag, menandatangani dan memuat naik foto tag yang ditandatangani. Selagi foto belum dimuat naik tiada tindakan lain untuk pemeriksa itu, dan pop-up muncul semula setiap kali aplikasi dibuka. Perancah menjadi Aktif hanya selepas foto. Jika telefon hilang atau rosak, admin boleh melepas kunci dengan sebab bertulis (direkodkan). Foto yang tiada selepas 24 jam muncul dalam ringkasan harian admin.','Mandur boleh menghantar permohonan perancah daripada borang tag yang sama. Ia tiada ID. Pemeriksa membukanya di Perancah baharu > Permohonan mandur dan melakukan langkah di atas.','Aplikasi memberi ID unik, contohnya PBS-T-2610-001 (kontraktor, jenis, tahun dan bulan, nombor turutan). Status Pending: jangan guna.','Pemeriksa perancah dimaklumkan, ke tapak, mengisi sub lokasi, melengkapkan senarai semak serah terima penuh dan memuat naik foto tag bertandatangan (depan).','Jika semua lulus, perancah menjadi Aktif dan tarikh pemeriksaan seterusnya ditetapkan. Satu item gagal menjadikannya Jangan guna, dan penyelia dimaklumkan.','Setiap minggu penyelia atau pemeriksa membuat pemeriksaan mingguan dan memuat naik foto tag belakang (grid pemeriksaan). Aplikasi memberi peringatan sehari sebelum dan pada hari akhir. Terlepas = Lewat.','Sesiapa yang bertanggungjawab (admin, pemeriksa, atau penyelia untuk kontraktornya) boleh menekan butang Tag merah pada bila-bila masa jika perancah tidak selamat. Tarikh dan masa, siapa dan sebabnya direkodkan, perancah dipaparkan TAG MERAH · Dilarang guna, dan penyelia serta pemeriksa dimaklumkan melalui e-mel. Pemeriksaan yang gagal juga memberi tag merah secara automatik. Peringatan berterusan setiap hari sehingga dibuang.','Hanya pemeriksa boleh membuang tag merah: lulus pemeriksaan semula (tag dibuang secara automatik dan direkodkan) atau guna Buang tag merah dengan sebab bertulis. Setiap pemasangan dan pembuangan kekal dalam log tag merah bersama masanya.','Apabila perancah dirobohkan, tandakan Dirobohkan; rekod kekal sebagai sejarah.']],
['Scaffolder dan sijil (aktif)',['HSSE IC menambah setiap scaffolder: nama, jawatan, telefon, foto orang.','Tambah sijil luaran: jenis, nombor, tarikh keluaran dan tamat, serta foto sijil. Tanpa sijil orang itu dipaparkan Tiada sijil dan tidak dikira bersijil.','Pembantu Pemasang Perancah tidak perlu sijil luaran, tetapi mesti ada Scaffolding Basic Awareness dan latihan Working at Height (sekurang-kurangnya dalaman), lengkap dengan tarikh dan tamat tempoh. Tanpa kedua-duanya pembantu dipaparkan Latihan belum lengkap.','Sebelum menyimpan, tandakan: Saya telah mengesahkan sijil dan semua data adalah benar dan telah disemak. Kemudian pop-up meminta pengesahan. Jika tidak pasti, jangan hantar.','Selepas dihantar, rekod dikunci dan tidak boleh diubah. Apabila sijil atau latihan diperbaharui, guna Baharui dan hantar sijil baharu dengan foto baharu. Setiap penghantaran disimpan. Jika kesilapan telah dihantar, admin boleh membuka kunci dengan sebab, dan ia mesti disahkan semula.','Aplikasi menghantar peringatan sebelum tamat. Baharui sijil, rekod dan foto sebelum tarikh.']],
['Latihan Kerja di Ketinggian (dirancang)',['HSSE IC merekod setiap latihan dalaman: orang, tarikh, jurulatih, tempoh sah.','Tarikh penyegaran mencetus peringatan yang sama.']],
['Harness (dirancang)',['HSSE IC mendaftar setiap harness: nombor siri, pengeluar, tarikh pembuatan, tarikh dikeluarkan, kontraktor, pengguna.','Penyelia perancah memeriksa sebelum guna dan merekodnya. HSSE membuat pemeriksaan berkala dan merekodnya. Kekerapan pemeriksaan dan senarai semak mesti disahkan dengan standard Shell / Mentari sebelum go-live.','Harness yang gagal, atau melebihi hayat, diberi tag Jangan guna dan dikeluarkan daripada perkhidmatan.']]],
ruleH:'Peraturan untuk diingat',
